[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosip-inji-conformance-harness"
version = "0.1.0"
description = "Automation harness for OpenID conformance testing of Inji Certify and Inji Verify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inji-conformance = "conformance_harness.cli:main"

[tool.setuptools.packages.find]
include = ["conformance_harness*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
